# CI mínimo de la plantilla. Corre en GitHub (sin IA) en cada push a main y en cada pull request.
#
# Hace cuatro cosas, y cada una se salta sola mientras todavía no aplica:
#   1. Valida diseño y plan, si existen tools/validar.py y el backlog repartido.
#   2. Prueba las herramientas de tools/, si existe tools/tests/.
#   3. Instala dependencias, si existe requirements.txt.
#   4. Comprueba el proyecto con tools/comprobar.py, si existe comprobaciones.json.
#
# Un paso omitido deja un aviso visible en la ejecución: un CI en verde NO significa
# que algo se haya probado hasta que existan tests.
#
# El paso 4 no tiene su propia lista de comandos: los lee de comprobaciones.json, el
# mismo archivo que usas tú y que usa el agente. Una sola definición por proyecto.
# Y comprobar.py falla cuando un comando termina bien sin haber ejecutado pruebas:
# «salió sin error» y «probó algo» no son lo mismo.
#
# T-001 (el esqueleto andante) adapta este archivo al stack de la app:
# versión de Python, base de datos de prueba y comando de test.
#
# Las acciones están fijadas a versiones exactas con más de tres meses (revisadas el 22-oct-2026).
# Para actualizarlas, cambia el número.
#
# La imagen está fijada a ubuntu-24.04 y no a ubuntu-latest: GitHub está pasando ubuntu-latest
# a Ubuntu 26.04 (entre el 19-oct y el 19-nov-2026). Cuando quieras migrar, cambia el número y prueba.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Validar diseño y plan
        run: |
          if [ ! -f tools/validar.py ]; then
            echo "::notice::Todavía no existe tools/validar.py: se omite la validación."
          elif [ ! -f docs/plan/backlog.md ]; then
            echo "::notice::Todavía no hay docs/plan/backlog.md: se omite la validación de diseño y plan hasta repartir el plan con init_plan.py. Las pruebas de tools/ se ejecutan igualmente."
          else
            python tools/validar.py
          fi

      - name: Probar las herramientas de tools/
        run: |
          if [ -d tools/tests ]; then
            python -m unittest discover -s tools/tests -v
          else
            echo "::notice::No hay tools/tests: se omite este paso."
          fi

      - name: Instalar dependencias
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "::notice::No hay requirements.txt: no se instaló nada."
          fi

      - name: Comprobar el proyecto
        run: |
          if [ -f comprobaciones.json ]; then
            python tools/comprobar.py entrega
          elif [ -n "$(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit 2>/dev/null)" ]; then
            echo "::error::Hay tests en tests/ pero no existe comprobaciones.json, así que el CI no sabe cuáles son los comandos del proyecto. Decláralos una sola vez: python tools/comprobar.py --ejemplo (lo hace T-001)."
            exit 1
          else
            echo "::warning::Todavía no hay comprobaciones.json ni tests en tests/: este paso no probó nada."
          fi
